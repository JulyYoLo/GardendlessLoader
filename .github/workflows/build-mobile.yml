name: Gardenless Online mobile
on:
  push:
    branches: ['gardenless-build/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - name: Build sideloadable test APK
        run: |
          rm -f pubspec_overrides.yaml
          flutter pub get
          flutter build apk --debug
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/Gardenless-Online-Android-test.apk
          "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)" verify dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Gardenless-Android-test
          path: dist/*.apk
          if-no-files-found: error
  ios:
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - name: Build iPhone and iPad IPA for signing
        run: |
          set -eu
          xcodebuild -version
          rm -f pubspec_overrides.yaml
          flutter pub get
          (cd ios && pod install)
          flutter build ios --release --no-codesign
          test -s build/ios/iphoneos/Runner.app/Runner
          mkdir -p "$RUNNER_TEMP/gardenless/Payload" dist
          ditto build/ios/iphoneos/Runner.app "$RUNNER_TEMP/gardenless/Payload/Runner.app"
          (cd "$RUNNER_TEMP/gardenless" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/Gardenless-Online-iOS-unsigned.ipa" Payload)
          unzip -tq dist/*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Gardenless-iOS-unsigned
          path: dist/*.ipa
          if-no-files-found: error
